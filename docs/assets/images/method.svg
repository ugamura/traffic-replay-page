<g font-family="Arial, sans-serif"><rect width="1120" height="310" fill="#f7f9f9"/>
<g fill="#fff" stroke="#d4e2e2"><rect x="30" y="55" width="225" height="80" rx="8"/><rect x="30" y="172" width="225" height="80" rx="8"/><rect x="310" y="55" width="225" height="80" rx="8"/><rect x="310" y="172" width="225" height="80" rx="8"/><rect x="590" y="90" width="225" height="120" rx="8" fill="#edf6f5" stroke="#087b82"/><rect x="870" y="90" width="220" height="120" rx="8"/></g>
<g fill="none" stroke="#7f9a9e" stroke-width="1.5" marker-end="url(#arrow)"><path d="M255 95h48"/><path d="M255 212h48"/><path d="M535 95h22v36h26"/><path d="M535 212h22v-36h26"/><path d="M815 150h48"/></g>
<g fill="#17272c" text-anchor="middle" font-size="16"><text x="142" y="90">Later site images</text><text x="142" y="113" fill="#54656b" font-size="12">+ measured distances</text><text x="142" y="207">Dashcam recording</text><text x="142" y="230" fill="#54656b" font-size="12">+ fixed camera calibration</text><text x="422" y="90">Metric scene</text><text x="422" y="113" fill="#54656b" font-size="12">SfM · road plane · 3DGS</text><text x="422" y="207">Registered camera</text><text x="422" y="230" fill="#54656b" font-size="12">+ learned body and foot contacts</text><text x="702" y="128" fill="#05616a" font-weight="bold">Contact-first placement</text><text x="702" y="154" font-size="12">Supporting-foot ray intersections</text><text x="702" y="176" font-size="12">+ temporal and full-body 2D terms</text><text x="980" y="128">Shared-world replay</text><text x="980" y="154" font-size="12" fill="#54656b">Pedestrian · vehicle proxy</text><text x="980" y="176" font-size="12" fill="#54656b">New viewpoints, same timeline</text></g>
<text x="702" y="241" fill="#54656b" text-anchor="middle" font-size="11">Body pose, orientation, scale and cameras remain fixed.</text></g></svg>
