<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="310" viewBox="0 0 1120 310" role="img" aria-labelledby="title desc">
<title id="title">Contact-first placement in a measured scene</title><desc id="desc">Later site images and measurements define a metric world. Registered dashcam frames and supporting-foot observations determine initial placement. Directional temporal and full-body 2D reprojection refinement produces shared-world replay with fixed body geometry.</desc>
